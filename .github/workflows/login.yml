# 工作流名称：Netlib 
name: Netlib Keepalive

# 工作流触发条件配置
on:
  # 定时任务调度（使用 cron 表达式）
  schedule:
    # cron 表达式格式：分钟 小时 日 月 星期
    # '0 0 */30 * *' 表示：
    #   - 0 分钟（每小时的第0分钟）
    #   - 0 小时（UTC时间的0点，即北京时间早上8点）
    #   - */30 天（每30天的倍数，即每30天执行一次）
    #   - * 月（每月）
    #   - * 星期（每周的任何一天）
    # 注意：GitHub Actions 使用 UTC 时间，0:0 UTC 对应北京时间 8:00
    - cron: '0 */12 * * *'  # 每30天运行一次（UTC时间0点，即北京时间早上8点）
  
  # 允许在 GitHub Actions 界面手动触发工作流
  # 可以在仓库的 Actions 标签页中点击 "Run workflow" 按钮手动执行
  workflow_dispatch:  # 允许手动运行

  # 1🎈
  # 现在只会在这两种情况下执行：
  # 定时（schedule，每 12 小时）
  # 手动（Actions 页点 Run workflow）
  # 推代码到远端不会再自动跑。若以后想「改了某文件才跑」，再加回类似这样即可：
  # push:
  #   branches: [master]
  #   paths:
  #     - 'login.js'
  #     - 'package.json'

  # 2🎈
  # # 用户 push 到 master 时执行
  # push:
  #   branches:
  #     - master
  #   # 忽略脚本自己生成的文件
  #   # 防止 Actions 自己 push 后再次触发
  #   paths-ignore:
  #     #- 'data/sub.txt'
  #     # - 'data/**'
  #     - 'README.md'

  # 3🎈
  # # 不写 push：推送/部署到远端后不会自动跑；需要时在 Actions 里手动 Run
  # # 若以后想「改了某些文件才跑」，可再加回 push + paths 过滤


# 允许 GitHub Actions 修改仓库内容
permissions:
  contents: write


# 工作流任务定义
jobs:
  # 任务名称：自动登录 Netlib
  auto_login_netlib:
    # 指定运行环境：使用最新的 Ubuntu Linux 系统
    # ubuntu-latest 是 GitHub 提供的免费运行器，包含常用的开发工具
    runs-on: ubuntu-latest
    
    # 任务步骤序列：按顺序执行以下步骤
    steps:
      # 步骤1：检出代码仓库
      # 将仓库代码下载到运行器的文件系统中，以便后续步骤可以使用
      - name: Checkout
        # 使用官方 checkout action（v4版本）
        # 这会克隆仓库代码到 $GITHUB_WORKSPACE 目录
        uses: actions/checkout@v4

      # 步骤2：设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 步骤3：安装依赖（@upstash/redis 等）
      - name: Install dependencies
        run: npm ci
        # run: npm install

      # 步骤4：运行登录脚本
      # 执行实际的自动登录逻辑
      - name: Run login script
        # 设置环境变量，从 GitHub Secrets 中读取敏感信息
        # GitHub Secrets 是加密存储的配置，不会在日志中暴露
        env:
          # Telegram Bot Token：用于发送通知消息的机器人令牌
          # 需要在 GitHub 仓库设置中配置 secrets.BOT_TOKEN
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          
          # Telegram Chat ID：接收通知消息的聊天 ID
          # 需要在 GitHub 仓库设置中配置 secrets.CHAT_ID
          CHAT_ID: ${{ secrets.CHAT_ID }}
          
          # 账号信息：格式为 "用户名1:密码1,用户名2:密码2"
          # 支持多个账号，使用逗号或分号分隔
          # 需要在 GitHub 仓库设置中配置 secrets.ACCOUNTS
          # 注意：账号密码以明文形式存储在 Secrets 中，请确保仓库是私有的
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          # 账号 URL：格式为 "URL1,URL2"
          URLS: ${{ secrets.URLS }}

          # Upstash Redis REST API 凭证
          # 需要在 GitHub 仓库设置中配置 secrets.UPSTASH_LIST 和 secrets.UPSTASH_URL
          UPSTASH_LIST: ${{ secrets.UPSTASH_LIST }}
          UPSTASH_URL: ${{ secrets.UPSTASH_URL }}
        
        # 执行 login.js：通过 fetch 访问账号 URL 保活，并通过 Telegram 发送通知
        run: npm start


      # 新增：更新 README 时间戳并清理旧日志
      - name: Update README Timestamp
        run: |
          # 设置时区为东八区（北京时间）
          export TZ='Asia/Shanghai'
          CURRENT_TIME=$(date "+%Y-%m-%d %H:%M:%S")

          sed -i '/更新于/d' README.md
          echo -e "更新于 $CURRENT_TIME" >> README.md


      # ==========================================
      # 4. 提交并 Push（每次都会更新 README 时间戳）
      # ==========================================
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore: ..."
          git push
